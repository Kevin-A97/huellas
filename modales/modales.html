<!-- Modal de edición de servicio -->
<div id="editModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-brandDark/25 p-4 backdrop-blur-md">
  <div class="w-full max-w-3xl overflow-hidden rounded-[34px] bg-white shadow-2xl">
    <div class="flex items-start justify-between gap-4 border-b border-violet-100 p-8">
      <div>
        <h2 class="text-3xl font-extrabold text-brandDark">Editar servicio</h2>
        <p id="editModalService" class="mt-2 text-lg text-muted">HM-1048 | Luna</p>
      </div>
      <button data-close-modal="editModal" class="text-4xl leading-none text-muted hover:text-ink transition">×</button>
    </div>
    <div class="grid gap-6 p-8">
      <label class="grid gap-2 text-sm font-bold">
        Tipo de servicio
        <select id="editType" class="rounded-2xl border-0 bg-[#f8f8fb] px-5 py-4 text-base outline-none focus:ring-4 focus:ring-violet-100">
          <option>Cremación Individual</option>
          <option>Plan Preventivo Exequial</option>
        </select>
      </label>
      <label class="grid gap-2 text-sm font-bold">
        Urna (color/modelo)
        <input id="editUrn" class="rounded-2xl border-0 bg-[#f8f8fb] px-5 py-4 text-base outline-none focus:ring-4 focus:ring-violet-100" />
      </label>
      <label class="grid gap-2 text-sm font-bold">
        Estado
        <select id="editStatus" class="rounded-2xl border-0 bg-[#f8f8fb] px-5 py-4 text-base outline-none focus:ring-4 focus:ring-violet-100">
          <option>Recolección</option>
          <option>Recibido</option>
          <option>En cremación</option>
          <option>Listo</option>
          <option>Entregado</option>
        </select>
      </label>
      <label class="grid gap-2 text-sm font-bold">
        Notas
        <textarea id="editNotes" rows="4" class="rounded-2xl border-0 bg-[#f8f8fb] px-5 py-4 text-base outline-none focus:ring-4 focus:ring-violet-100"></textarea>
      </label>
    </div>
    <div class="flex justify-end gap-4 bg-[#fbfbfd] p-8">
      <button data-close-modal="editModal" class="rounded-xl px-5 py-3 font-bold text-muted hover:bg-gray-100 transition">Cancelar</button>
      <button id="saveServiceBtn" class="rounded-xl bg-brand px-8 py-3 font-extrabold text-white shadow-soft hover:bg-brandDark transition">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- Modal de nuevo cliente -->
<div id="clientModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-brandDark/25 p-4 backdrop-blur-md">
  <div class="w-full max-w-xl rounded-[34px] bg-white p-8 shadow-2xl">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 class="text-xl font-extrabold">Nuevo cliente</h2>
        <p class="text-sm text-muted">Registra una familia para iniciar acompañamiento y seguimiento.</p>
      </div>
      <button data-close-modal="clientModal" class="rounded-xl border border-violet-100 px-3 py-2 text-sm font-bold hover:bg-soft transition">Cerrar</button>
    </div>
    <div class="mt-5 grid gap-4">
      <label class="grid gap-2 text-sm font-bold">Nombre
        <input id="newClientName" class="rounded-xl border border-violet-100 px-3 py-3 outline-none focus:ring-4 focus:ring-violet-100" placeholder="Familia Zambrano" />
      </label>
      <label class="grid gap-2 text-sm font-bold">Mascota
        <input id="newClientPet" class="rounded-xl border border-violet-100 px-3 py-3 outline-none focus:ring-4 focus:ring-violet-100" placeholder="Rocky" />
      </label>
      <label class="grid gap-2 text-sm font-bold">Estado
        <select id="newClientStatus" class="rounded-xl border border-violet-100 px-3 py-3 outline-none focus:ring-4 focus:ring-violet-100">
          <option>Prospecto</option>
          <option>Activo</option>
          <option>Seguimiento</option>
        </select>
      </label>
    </div>
    <div class="mt-6 flex justify-end gap-3">
      <button data-close-modal="clientModal" class="rounded-xl border border-violet-100 px-4 py-2 text-sm font-bold hover:bg-soft transition">Cancelar</button>
      <button id="saveClientBtn" class="rounded-xl bg-brand px-4 py-2 text-sm font-bold text-white hover:bg-brandDark transition">Agregar cliente</button>
    </div>
  </div>
</div>

<!-- Toast de notificación -->
<div id="toast" class="fixed bottom-5 right-5 z-50 hidden rounded-2xl bg-ink px-5 py-3 text-sm font-bold text-white shadow-2xl transition-all"></div>
